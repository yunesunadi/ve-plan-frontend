@let invited_users = invited_users$ | async;

@if (invited_users) {
  <mat-dialog-content class="pt-3">
    <h2 class="dialog-heading">Invited users</h2>
    @if (invited_users.length > 0) {
      @for (item of invited_users; track item.user.email) {
        <p class="mb-1">{{ $index + 1 }}. {{ item.user.name }}</p>
      }
    } @else {
      <app-empty-state
        compact
        icon="mail_outline"
        headline="Nobody invited yet"
        supporting="Invited users will be listed here."
      />
    }
  </mat-dialog-content>
  <mat-dialog-actions [align]="'end'">
    <button 
      mat-button
      type="button"  
      mat-dialog-close
    >
      Cancel
    </button>
  </mat-dialog-actions>
}
