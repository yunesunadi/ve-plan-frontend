<h2 mat-dialog-title [id]="titleId">{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-dialog__body" [id]="bodyId">{{ data.body }}</p>

  @if (requiresPhrase()) {
    <mat-form-field appearance="outline" class="confirm-dialog__phrase-field">
      <mat-label>{{ data.confirmationHint || 'Type to confirm' }}</mat-label>
      <input
        matInput
        type="text"
        autocomplete="off"
        [attr.aria-describedby]="bodyId"
        (input)="onPhraseInput($event)"
      />
      <mat-hint>Type "{{ data.confirmationPhrase }}" exactly to confirm.</mat-hint>
    </mat-form-field>
  }
</mat-dialog-content>

<mat-dialog-actions [align]="'end'" [class.confirm-dialog__actions--destructive]="destructive()">
  @if (showCancel()) {
    <button mat-button type="button" (click)="cancel()">{{ cancelLabel() }}</button>
  }
  <button
    mat-flat-button
    type="button"
    class="confirm-dialog__confirm-btn"
    [disabled]="confirmDisabled()"
    (click)="confirm()"
  >
    {{ confirmLabel() }}
  </button>
</mat-dialog-actions>
