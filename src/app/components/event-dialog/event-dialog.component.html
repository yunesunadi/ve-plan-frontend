<h2 mat-dialog-title>
  {{ dialog_data._id ? "Edit event" : "Create event" }}
</h2>
<form [formGroup]="create_form" (ngSubmit)="submit()">
<mat-dialog-content>
  <div class="stack create-form">
    <div class="cover-wrap mb-3">
      <p class="mb-1">Cover</p>
      <label for="cover" class="cover-img-container">
        <input id="cover" type="file" accept="image/*" (change)="changeCover($event)" class="cover-file-input">
        <img src="assets/images/placeholder.jpg" #imgView alt="Cover image" class="cover-img rounded">
      </label>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput type="text" formControlName="title" placeholder="Enter title">
      <mat-error appFormError [control]="titleControl" labelFor="Title" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        cdkTextareaAutosize
        cdkAutosizeMinRows="3"
        formControlName="description"
        placeholder="Enter description"
      ></textarea>
      <mat-error appFormError [control]="descriptionControl" labelFor="Description" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Date</mat-label>
      <input matInput [matDatepicker]="datepicker" [min]="minDate" formControlName="date" placeholder="DD/MM/YYYY">
      <mat-datepicker-toggle matIconSuffix [for]="datepicker" />
      <mat-datepicker #datepicker />
      <mat-error appFormError [control]="dateControl" labelFor="Date" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Start time</mat-label>
      <input matInput [matTimepicker]="timepicker1" formControlName="start_time">
      <mat-timepicker #timepicker1/>
      <mat-timepicker-toggle [for]="timepicker1" matSuffix/>
      <mat-error appFormError [control]="startTimeControl" labelFor="Start time" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>End time</mat-label>
      <input matInput [matTimepicker]="timepicker2" formControlName="end_time">
      <mat-timepicker #timepicker2/>
      <mat-timepicker-toggle [for]="timepicker2" matSuffix/>
      <mat-error appFormError [control]="endTimeControl" labelFor="End time" />
    </mat-form-field>
    <mat-error appFormError [control]="create_form" labelFor="Time" class="mb-3 time-error" />
    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        @for (category of categories; track category) {
          <mat-option [value]="category">
            {{ category }}
          </mat-option>
        }
      </mat-select>
      <mat-error appFormError [control]="categoryControl" labelFor="Category" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        @for (type of types; track type) {
          <mat-option [value]="type">
            {{ type }}
          </mat-option>
        }
      </mat-select>
      <mat-error appFormError [control]="typeControl" labelFor="Type" />
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions [align]="'end'">
  <button
    mat-button
    type="button"
    mat-dialog-close
  >
    Cancel
  </button>
  <app-submit-button label="Done" [busy]="submitting()" cdkFocusInitial />
</mat-dialog-actions>
</form>
