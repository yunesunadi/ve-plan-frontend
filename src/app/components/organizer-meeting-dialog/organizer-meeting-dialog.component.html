<mat-dialog-content style="min-height: 100%; padding: 0;">
  <div class="d-flex justify-content-end align-items-center p-2" style="gap: .5rem; background: #432E54;">
    @if (end_error()) {
      <span class="text-light small me-auto">{{ end_error() }}</span>
      <button
        type="button"
        class="btn btn-sm btn-warning fw-bold"
        [disabled]="is_ending()"
        (click)="leaveAndEnd()"
      >
        Retry
      </button>
    }
    <button
      type="button"
      class="btn btn-sm btn-light fw-bold"
      [disabled]="is_ending()"
      (click)="leaveAndEnd()"
    >
      {{ is_ending() ? "Ending…" : "Leave & End Meeting" }}
    </button>
  </div>
  <div #jitsi_iframe style="width: 100%; height: calc(100% - 52px);"></div>
</mat-dialog-content>
