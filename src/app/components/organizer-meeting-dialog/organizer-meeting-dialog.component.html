<mat-dialog-content class="jitsi-dialog-content">
  <div class="cluster cluster--end error-strip p-2">
    @if (end_error()) {
      <span class="text-light small me-auto">{{ end_error() }}</span>
      <button
        type="button"
        mat-flat-button
        class="fw-bold retry-btn"
        [disabled]="is_ending()"
        (click)="leaveAndEnd()"
      >
        Retry
      </button>
    }
    <button
      type="button"
      mat-stroked-button
      class="fw-bold leave-btn"
      [disabled]="is_ending()"
      (click)="leaveAndEnd()"
    >
      {{ is_ending() ? "Ending…" : "Leave & End Meeting" }}
    </button>
  </div>
  <div #jitsi_iframe class="jitsi-frame"></div>
</mat-dialog-content>
