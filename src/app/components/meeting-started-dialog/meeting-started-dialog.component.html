<h2 mat-dialog-title>Notify meeting attendees</h2>

<mat-dialog-content>
  @if (dialog_data.length > 0) {
    <p class="dialog-lead">These attendees will get a “meeting has started” email:</p>
    <ol class="pending-list">
      @for (item of dialog_data; track item.user_id) {
        <li>{{ item.name }}</li>
      }
    </ol>
  } @else {
    <app-empty-state
      compact
      icon="group_off"
      headline="No attendees selected"
      supporting="Select at least one attendee to notify."
    />
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button
    mat-flat-button
    type="button"
    (click)="send()"
    [disabled]="dialog_data.length === 0 || sending()"
  >
    {{ sending() ? 'Sending…' : 'Send email' }}
  </button>
</mat-dialog-actions>
