<main class="auth-shell">
  <section class="auth-shell__brand">
    <a routerLink="/login" class="auth-shell__lockup" aria-label="VE-Plan home">
      <app-brand-logo [size]="42" />
    </a>
    <p class="auth-shell__tagline">
      A comprehensive virtual event planning platform that helps you organize and attend
      virtual events with ease.
    </p>
  </section>
  <section class="auth-shell__panel">
    <div class="auth-shell__panel-inner">
      <ng-content select="[form]"></ng-content>
    </div>
  </section>
</main>
