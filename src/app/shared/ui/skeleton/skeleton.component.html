<div class="skeleton" aria-busy="true">
  @switch (variant()) {
    @case ('card') {
      <div class="skeleton-card">
        <div class="skeleton-block skeleton-card__cover" aria-hidden="true"></div>
        <div class="skeleton-block skeleton-card__title" aria-hidden="true"></div>
        <div class="skeleton-block skeleton-card__line" aria-hidden="true"></div>
        <div class="skeleton-block skeleton-card__line skeleton-card__line--short" aria-hidden="true"></div>
        <div class="skeleton-card__chips" aria-hidden="true">
          <span class="skeleton-block skeleton-card__chip"></span>
          <span class="skeleton-block skeleton-card__chip"></span>
        </div>
      </div>
    }
    @case ('table-row') {
      @for (row of rowArray(); track $index) {
        <div class="cluster skeleton-table-row" aria-hidden="true">
          <span class="skeleton-block" aria-hidden="true"></span>
          <span class="skeleton-block" aria-hidden="true"></span>
          <span class="skeleton-block" aria-hidden="true"></span>
          <span class="skeleton-block" aria-hidden="true"></span>
        </div>
      }
    }
    @default {
      @for (barWidth of textBars(); track $index) {
        <span
          class="skeleton-block"
          [class.skeleton-block--circle]="variant() === 'circle'"
          [style.width]="barWidth"
          [style.height]="resolvedHeight()"
          aria-hidden="true"
        ></span>
      }
    }
  }
</div>
