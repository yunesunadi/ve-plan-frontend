@if (password()) {
  <div class="pw-strength">
    <div class="pw-strength__bars" [attr.data-score]="strength().score" aria-hidden="true">
      @for (i of bars; track i) {
        <span class="pw-strength__bar" [class.is-on]="i <= strength().score"></span>
      }
    </div>
    <span class="pw-strength__label">{{ strength().label }}</span>
  </div>
  <span class="visually-hidden" aria-live="polite">Password strength: {{ strength().label }}</span>
}
