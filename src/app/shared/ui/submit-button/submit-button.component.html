<button
  mat-flat-button
  type="submit"
  class="submit-button"
  [disabled]="busy() || disabled()"
  [attr.aria-busy]="busy()"
>
  <span class="submit-button__content">
    @if (busy()) {
      <mat-spinner class="submit-button__spinner" diameter="18" aria-hidden="true" />
    }
    <span>{{ busy() ? (busyLabel() || label()) : label() }}</span>
  </span>
</button>
