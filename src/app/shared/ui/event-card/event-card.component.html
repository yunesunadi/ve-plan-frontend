<ng-template #cardBody>
  <div class="event-card__cover">
    @if (showCover()) {
      <img
        class="event-card__cover-img"
        [src]="coverSrc()"
        [alt]="event().title + ' cover image'"
        width="400"
        height="225"
        loading="lazy"
        decoding="async"
        (error)="onCoverError()"
      />
    } @else {
      <div class="event-card__cover-fallback" aria-hidden="true">
        <mat-icon>{{ categoryMeta().icon }}</mat-icon>
      </div>
    }

    @if (derivedStatus(); as chipStatus) {
      <span class="event-card__status">
        <app-status-chip [status]="chipStatus" dense />
      </span>
    }
  </div>

  <div class="event-card__body">
    <h3 class="event-card__title">{{ event().title }}</h3>
    <p class="event-card__description">{{ event().description }}</p>

    <div class="cluster event-card__time">
      <mat-icon aria-hidden="true">schedule</mat-icon>
      <span>{{ timeRange() }}</span>
    </div>

    <div class="cluster event-card__tags">
      <span class="event-card__tag">
        <mat-icon aria-hidden="true">{{ categoryMeta().icon }}</mat-icon>
        {{ categoryMeta().label }}
      </span>
      <app-status-chip [status]="event().type" variant="outlined" dense />
    </div>

    <div class="cluster event-card__organizer">
      <app-avatar [user]="event().user" size="xs" />
      <span>{{ event().user.name }}</span>
    </div>
  </div>
</ng-template>

<article class="event-card" [class.event-card--compact]="density() === 'compact'" [class.event-card--interactive]="!!link()">
  @if (link(); as href) {
    <a class="event-card__surface" [routerLink]="href">
      <ng-container [ngTemplateOutlet]="cardBody" />
    </a>
  } @else {
    <div class="event-card__surface event-card__surface--static">
      <ng-container [ngTemplateOutlet]="cardBody" />
    </div>
  }

  <footer class="event-card__actions">
    <ng-content select="[card-actions]" />
  </footer>
</article>
