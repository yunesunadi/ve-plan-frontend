<mat-card appearance="outlined">
  <mat-card-content class="session">
    <div class="session__head">
      <h3 class="session__title">{{ session.title }}</h3>
      <ng-content></ng-content>
    </div>

    <p class="session__time">
      <mat-icon aria-hidden="true">schedule</mat-icon>
      <span>{{ session.start_time | date: "hh:mm a" }} &ndash; {{ session.end_time | date: "hh:mm a" }}</span>
    </p>

    @if (session.description) {
      <p class="session__field"><span class="session__label">Description</span>{{ session.description }}</p>
    }
    @if (session.speaker_info) {
      <p class="session__field"><span class="session__label">Speaker</span>{{ session.speaker_info }}</p>
    }
  </mat-card-content>
</mat-card>
