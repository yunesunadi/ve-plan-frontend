<app-register-wrapper>
  <ng-container form>
    <h1 class="text-primary-clr mb-3 show-md-down text-center">VE-Plan</h1>
    <h3 class="text-primary-clr mb-4 text-center">Sign Up</h3>
    <form [formGroup]="signup_form" (ngSubmit)="submit()" class="stack signup-form">
      <div class="profile-picker mb-3">
        <p class="mb-1">Profile</p>
        <label for="profile" class="profile-img-container">
          <input id="profile" type="file" accept="image/*" (change)="changeProfile($event)" class="profile-file-input">
          <img src="assets/images/placeholder.jpg" #imgView alt="Profile image" class="profile-img rounded">
        </label>
      </div>
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput type="text" formControlName="name" placeholder="Enter name">
        <mat-error appFormError [control]="nameControl" labelFor="Name" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input type="email" matInput formControlName="email" placeholder="Enter email">
        <mat-error appFormError [control]="emailControl" labelFor="Email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="isPassword() ? 'password' : 'text'" formControlName="password" placeholder="Enter password" />
        <button
          type="button"
          mat-icon-button
          matSuffix
          (click)="togglePasswordVisibility()"
        >
          <mat-icon>{{ isPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error appFormError [control]="passwordControl" labelFor="Password" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Confirm Password</mat-label>
        <input matInput [type]="isConfirmPassword() ? 'password' : 'text'" formControlName="confirm_password" placeholder="Enter confirm password" />
        <button
          type="button"
          mat-icon-button
          matSuffix
          (click)="toggleConfirmPasswordVisibility()"
        >
          <mat-icon>{{ isConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error appFormError [control]="confirmPasswordControl" labelFor="Confirm password" />
        <mat-error appFormError [control]="signup_form" />
      </mat-form-field>
      <app-submit-button label="Sign Up" [busy]="submitting()" />
    </form>
    <p class="mt-3 mb-0">
      Already have an account?
      <a class="text-decoration-underline" routerLink="/login">Login</a>
    </p>
  </ng-container>
</app-register-wrapper>
