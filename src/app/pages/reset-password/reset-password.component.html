<app-register-wrapper>
  <ng-container form>
    @if (expired()) {
      <h1 class="auth-title">Link expired</h1>
      <p class="auth-subtitle">{{ expiredMessage() }}</p>
      <div class="cluster cluster--center">
        <a routerLink="/forgot_password" mat-flat-button>
          Request a new reset link
        </a>
      </div>
    } @else {
      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-subtitle">Choose a password with at least 8 characters.</p>
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="stack reset-password-form" novalidate>
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>New password</mat-label>
          <input
            matInput
            [type]="isPassword() ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your new password"
            autocomplete="new-password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            [attr.aria-label]="isPassword() ? 'Show password' : 'Hide password'"
            [attr.aria-pressed]="!isPassword()"
            (click)="togglePasswordVisibility()"
          >
            <mat-icon>{{ isPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error appFormError [control]="passwordControl" labelFor="Password" />
        </mat-form-field>

        <app-password-strength [password]="passwordValue()" />

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Confirm password</mat-label>
          <input
            matInput
            [type]="isConfirmPassword() ? 'password' : 'text'"
            formControlName="confirm_password"
            placeholder="Re-enter your new password"
            autocomplete="new-password"
            [errorStateMatcher]="confirmPasswordMatcher"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            [attr.aria-label]="isConfirmPassword() ? 'Show password' : 'Hide password'"
            [attr.aria-pressed]="!isConfirmPassword()"
            (click)="toggleConfirmPasswordVisibility()"
          >
            <mat-icon>{{ isConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error appFormError [control]="confirmPasswordControl" labelFor="Confirm password" />
          <mat-error appFormError [control]="resetPasswordForm" />
        </mat-form-field>

        <div class="cluster cluster--center">
          <app-submit-button label="Reset password" [busy]="submitting()" [disabled]="resetPasswordForm.invalid" />
        </div>
      </form>
    }
    <div class="mt-4">
      <a routerLink="/login" class="auth-back-link cluster cluster--center">
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
        <span>Back to log in</span>
      </a>
    </div>
  </ng-container>
</app-register-wrapper>
