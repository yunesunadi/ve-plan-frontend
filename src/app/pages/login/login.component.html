<app-register-wrapper>
  <ng-container form>
    <h1 class="text-primary-clr mb-3 show-md-down text-center">VE-Plan</h1>
    <h3 class="text-primary-clr mb-4 text-center">Login</h3>
    <div class="stack oauth-buttons border-bottom pb-4 mb-4">
      <button mat-stroked-button class="text-primary-clr" (click)="loginWithGoogle()">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="oauth-logo" />
        Sign in with Google
      </button>
      <button mat-stroked-button class="text-primary-clr" (click)="loginWithFacebook()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook logo" class="oauth-logo oauth-logo--facebook" />
        Sign in with Facebook
      </button>
    </div>
    <form [formGroup]="login_form" (ngSubmit)="submit()" class="stack login-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input type="email" matInput formControlName="email" placeholder="Enter email">
        <mat-error appFormError [control]="emailControl" labelFor="Email" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="isPassword() ? 'password' : 'text'" formControlName="password" placeholder="Enter password" />
        <button
          type="button"
          mat-icon-button
          matSuffix
          (click)="togglePasswordVisibility()"
        >
          <mat-icon>{{ isPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error appFormError [control]="passwordControl" labelFor="Password" />
      </mat-form-field>
      <div class="text-end mb-3">
        <a routerLink="/forgot_password" class="text-primary-clr text-decoration-none">Forgot Password?</a>
      </div>
      <app-submit-button label="Login" [busy]="submitting()" />
    </form>
    <p class="mt-3 mb-0">
      Don't have an account?
      <a class="text-decoration-underline" routerLink="/signup">Sign Up</a>
    </p>
  </ng-container>
</app-register-wrapper>
