<app-register-wrapper>
  <ng-container form>
    <h1 class="auth-title">Choose your role</h1>
    <p class="auth-subtitle">
      Pick how you'll use VE-Plan. This choice is <strong>permanent</strong> — it can't be
      changed later.
    </p>

    <form class="role-form stack" (ngSubmit)="confirmAndSubmit()">
      <div class="role-cards" role="radiogroup" aria-label="Choose your role">
        @for (option of roleOptions; track option.value) {
          <button
            type="button"
            role="radio"
            class="role-card"
            [class.is-selected]="chosen_role() === option.value"
            [attr.aria-checked]="chosen_role() === option.value"
            (click)="chosen_role.set(option.value)"
          >
            <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
            <span class="role-card__title">{{ option.title }}</span>
            <span class="role-card__desc">{{ option.description }}</span>
          </button>
        }
      </div>

      <app-submit-button
        label="Continue"
        [busy]="submitting()"
        [disabled]="!chosen_role()"
        class="role-submit mt-1"
      />
    </form>
  </ng-container>
</app-register-wrapper>
