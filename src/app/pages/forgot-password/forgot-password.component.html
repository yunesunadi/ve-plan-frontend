<app-register-wrapper>
  <ng-container form>
    <h1 class="text-primary-clr mb-3 show-md-down text-center">VE-Plan</h1>
    <h3 class="text-primary-clr mb-4 text-center">Forgot Password</h3>
    <p class="text-center mx-3 mb-4">Please enter your email to reset your password.</p>
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="stack forgot-password-form w-100">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" placeholder="Enter your email" />
        <mat-error appFormError [control]="forgotPasswordForm.controls['email']" labelFor="Email" />
      </mat-form-field>
      <div class="cluster cluster--center">
        <app-submit-button label="Reset Password" [busy]="submitting()" [disabled]="forgotPasswordForm.invalid" />
      </div>
    </form>
    <div class="mt-3">
      <a routerLink="/login" class="text-primary-clr cluster cluster--center back-to-login">
        <mat-icon>arrow_back</mat-icon>
        <span>Back to Login</span>
      </a>
    </div>
  </ng-container>
</app-register-wrapper>
