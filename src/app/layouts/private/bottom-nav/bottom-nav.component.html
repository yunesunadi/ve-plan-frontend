<nav class="bottom-nav" role="navigation" aria-label="Primary">
  @for (destination of primaryDestinations(); track destination.link) {
    <a
      class="bottom-nav__item"
      [routerLink]="destination.link"
      routerLinkActive="bottom-nav__item--active"
    >
      <mat-icon class="bottom-nav__icon" aria-hidden="true">{{ destination.icon }}</mat-icon>
      <span class="bottom-nav__label">{{ destination.label }}</span>
    </a>
  }
</nav>
