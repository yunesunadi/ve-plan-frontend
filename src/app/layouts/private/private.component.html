@let current_user = current_user$ | async;
@let notifications_count = notifications_count$ | async;

<div class="app-shell">
  <a class="skip-link visually-hidden" href="#main-content">Skip to main content</a>

  <mat-toolbar class="app-toolbar">
    <button
      mat-icon-button
      aria-label="Toggle navigation"
      (click)="drawer.toggle()"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <a routerLink="home" class="brand cluster" aria-label="VE-Plan home">
      <mat-icon class="brand__mark" aria-hidden="true">celebration</mat-icon>
      <span class="brand__wordmark">VE-Plan</span>
    </a>

    <span class="spacer"></span>

    @if ((socketConnected$ | async) === false) {
      <mat-icon
        class="me-3"
        matTooltip="Reconnecting…"
        role="status"
        aria-label="Reconnecting"
      >cloud_off</mat-icon>
    }

    <button
      mat-icon-button
      class="me-3 app-toolbar__bell"
      routerLink="notifications"
      [matBadge]="notifications_count"
      [matBadgeHidden]="notifications_count === 0"
      aria-live="polite"
      [attr.aria-label]="notifications_count ? notifications_count + ' unread notifications' : 'Notifications'"
    >
      <mat-icon aria-hidden="true">notifications_active</mat-icon>
    </button>

    <button
      mat-button
      class="profile-trigger cluster"
      [matMenuTriggerFor]="menu"
      #menuTrigger="matMenuTrigger"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuTrigger.menuOpen"
    >
      <app-avatar [user]="current_user" size="sm" />
      <span class="profile-trigger__name">{{ current_user?.name }}</span>
      <mat-icon aria-hidden="true">keyboard_arrow_down</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item [matMenuTriggerFor]="themeMenu">
        <mat-icon>contrast</mat-icon>
        Appearance
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-menu>
    <mat-menu #themeMenu="matMenu">
      @for (option of themeOptions; track option.value) {
        <button
          mat-menu-item
          (click)="theme.setPreference(option.value)"
          [attr.aria-checked]="theme.preference() === option.value"
          role="menuitemradio"
        >
          <mat-icon>{{ theme.preference() === option.value ? 'radio_button_checked' : option.icon }}</mat-icon>
          {{ option.label }}
        </button>
      }
    </mat-menu>
  </mat-toolbar>

  <div class="app-shell__body">
    <mat-drawer-container class="h-100 app-drawer-container" autosize>
      <mat-drawer
        #drawer
        class="app-drawer"
        [class.app-drawer--rail]="isRail()"
        [mode]="layout.isCompact() ? 'over' : 'side'"
        [opened]="!layout.isCompact()"
      >
        <app-nav
          [destinations]="destinations()"
          [expanded]="!isRail()"
          (linkActivated)="layout.isCompact() && drawer.close()"
        />
      </mat-drawer>

      <mat-drawer-content class="app-shell__content" id="main-content" tabindex="-1">
        <router-outlet />
      </mat-drawer-content>
    </mat-drawer-container>
  </div>

  @if (layout.isCompact()) {
    <app-bottom-nav [destinations]="destinations()" />
  }
</div>
