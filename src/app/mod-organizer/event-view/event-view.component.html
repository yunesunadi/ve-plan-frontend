@let event = displayEvent();

<app-outlet-inner>
  <app-page-header [title]="event.title" [backTo]="['/organizer/dashboard/my_events']">
    @if (store.canManage()) {
      <div header-actions class="cluster">
        <button mat-stroked-button type="button" (click)="editEvent(event)">
          <mat-icon>edit</mat-icon> Edit
        </button>
        <button mat-stroked-button type="button" (click)="deleteEvent(event._id, event.title)">
          <mat-icon>delete</mat-icon> Delete
        </button>
      </div>
    }
  </app-page-header>

  <nav class="tab-nav event-tabs" aria-label="Event sections">
    <a class="tab-nav__link" routerLink="overview" routerLinkActive="tab-nav__link--active"
       #overview="routerLinkActive" [attr.aria-current]="overview.isActive ? 'page' : null">
      Overview
    </a>
    <a class="tab-nav__link" routerLink="agenda" routerLinkActive="tab-nav__link--active"
       #agenda="routerLinkActive" [attr.aria-current]="agenda.isActive ? 'page' : null">
      Agenda
    </a>
    <a class="tab-nav__link" routerLink="people" routerLinkActive="tab-nav__link--active"
       #people="routerLinkActive" [attr.aria-current]="people.isActive ? 'page' : null">
      People
    </a>
    <a class="tab-nav__link" [routerLink]="['/organizer/dashboard/events', event._id, 'meeting']">
      Meeting
    </a>
  </nav>

  <div class="event-tabs__body">
    <router-outlet />
  </div>
</app-outlet-inner>
