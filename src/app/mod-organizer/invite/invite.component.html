@let event = this.event();
@let query = (query$ | async)!;
@let rows = (dataSource$ | async)!;

<app-outlet-inner>
  <app-page-header
    title="Invite Users"
    [backTo]="['/organizer/dashboard/events', event._id, 'view']"
  >
    <div header-actions class="cluster">
      @if (event) {
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More invite actions">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="openInvitedUsersDialog(event._id)">
            <mat-icon>supervised_user_circle</mat-icon>
            Invited Users
          </button>
          <button mat-menu-item (click)="openAcceptedUsersDialog(event._id)">
            <mat-icon>done_all</mat-icon>
            Accepted Users
          </button>
        </mat-menu>
      }
    </div>
  </app-page-header>

  <app-email-delivery-status [eventId]="event._id"></app-email-delivery-status>

  <app-data-table
    [dataSource]="rows"
    [columns]="['id', 'name']"
    [loading]="tableLoading()"
    [error]="tableError()"
    searchLabel="Search Users"
    searchPlaceholder="Enter name or email"
    [searchValue]="query.search"
    (searchValueChange)="handleSearchChange($event, query, event._id)"
    [selectable]="true"
    [selection]="selection"
    (selectionChange)="selection = $event"
    [total]="total()"
    [pageSize]="PAGE_SIZE"
    [pageIndex]="query.offset / PAGE_SIZE"
    emptyIcon="person_search"
    emptyHeadline="Search for attendees to invite"
    emptySupporting="Type at least 2 characters of a name or email above to find people to invite."
    (pageChange)="handlePageChange($event, query, event._id)"
    (retry)="retry()"
  >
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-template #cardRow let-row>
      <div class="stack" style="--stack-gap: var(--app-space-1)">
        <span class="fw-bold">{{ row.name }}</span>
        <span class="text-muted">{{ row.email }}</span>
      </div>
    </ng-template>

    <button
      table-actions
      mat-flat-button
      type="button"
      (click)="sendInvitation(selection, event._id)"
      [disabled]="util.is_event_expired(event)"
    >
      <mat-icon>mail</mat-icon>
      Send Invitation
    </button>
  </app-data-table>
</app-outlet-inner>
